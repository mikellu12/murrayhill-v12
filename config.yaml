seed: 42

paths:
  raw: data/raw
  processed: data/processed
  imagery: data/raw/svi
  results: results

# Metre-based CRS for every distance, bearing and street-axis computation.
# Not cosmetic: the axis fitted in this projection sets the walk bearings that
# each render is centred on, so a wrong zone rotates every exported view. 32618
# is UTM 18N, centred on 75 W -- correct for Manhattan, badly distorted anywhere
# else. A second study area sets its own (config_london.yaml uses 27700, OSGB36
# British National Grid).
# Nodes whose imagery is not street, listed by ID because nothing in the data
# distinguishes them. n00144-n00147 sit on the Park Avenue viaduct ramp beside
# Grand Central, where the panorama faces the underside of the structure.
#
# NODE IDS ARE POSITIONAL, so this list belongs to THIS frame and no other. It
# was a module constant in tools/export_svi_180.py and silently applied to
# London, where the same four IDs are Bishopsgate -- four nodes on one of the
# City's main streets dropped for sharing a number with a Manhattan viaduct.
# A second study area sets its own list or leaves it empty.
excluded_nodes:
  # Eye-checked against the renders 2026-09-03: balustrade both kerbs, no
  # sidewalk, roadway only. n00148/n00149 (east) and n00242/n00244 (west) are
  # on the same deck and were missed by the lateral test because the deck runs
  # straight there. n00241 stays usable -- it is UNDER the structure at grade,
  # with pedestrians and crosswalks -- as do n00240 and n00143 beside the ramp.
  viaduct: ["n00144", "n00145", "n00146", "n00147", "n00148", "n00149",
            "n00242", "n00244"]
  # The approach ramp: nodes on the Park Avenue chains that leave the straight
  # avenue and curve toward Grand Central -- measured at 21-44 m lateral to a
  # line fitted through the straight part of each chain, against < 12 m for
  # every other node. Structurally they are the bridge approach, not the
  # avenue. Same caveat as above: node ids are positional to THIS frame.
  viaduct_approach: ["n00150", "n00151", "n00243", "n00245"]

# A place name to put in every rating prompt, or null for none.
#
# NULL IS THE DEFAULT AND SHOULD STAY THAT WAY. The prompts used to say
# "Rate this Manhattan street view" in every study area, which was simply wrong
# in London. Correcting it per city would have been worse: the study compares
# two cities, so the instrument has to be identical in both, and a name in the
# prompt hands the model a different prior for each. A Murray Hill against
# London difference would then be partly a difference between what the model
# expects of the two words.
#
# The ratings are meant to be a reading of the image. Anything the model is
# told about the image that is not in it is a confound, and this was the only
# one. Murray Hill's sim_vlm_v3.csv predates this and was rated with
# "Manhattan"; it needs re-rating before the two cities go in one table.
prompt_place: null

# What this study area is called. Used for the `city` column in the exported
# tables and for the shareable filename: both areas otherwise write
# vlm_observations.csv, and the two are indistinguishable once they leave the
# repository and sit in someone's downloads folder.
study_area_name: "Murray Hill, Manhattan"
study_area_slug: "murrayhill"

projected_crs: 32618

study_area:
  # THE STUDY AREA IS THE QUADRILATERAL BELOW, NOT THE BBOX.
  #
  # Murray Hill: Madison Ave (W) to First Ave (E), E 34th (S) to E 42nd (N).
  # That boundary is set by `corner_pairs` -- the four named intersections
  # are located in the downloaded network, the quadrilateral between them is
  # built, and everything outside it plus clip_buffer_m is discarded in s01.
  # 766 nodes across 19 street segments come out of it.
  #
  # Fifth Avenue and the Empire State block are Midtown South / NoMad on
  # most delimitations. Manhattan neighbourhood boundaries are not
  # official; cite the source you follow and state it in the methods.
  #
  # `bbox` is a DOWNLOAD BOUND for OSMnx, nothing more. It is 3.04 km2 to the
  # study area's 1.16 -- 250 to 400 m of margin on every side -- because the
  # corner intersections have to sit inside the downloaded graph to be found
  # by name, and the street chains have to run past the clip line to be cut
  # cleanly rather than ending ragged at the edge. Nothing in that margin is
  # ever studied: it is dropped in s01 and never reaches s02.
  bbox: {west: -73.9870, south: 40.7415, east: -73.9655, north: 40.7565}
  corner_pairs:
    - ["Madison\\s+Ave",       "East\\s+34th\\s+St"]
    - ["Madison\\s+Ave",       "East\\s+42nd\\s+St"]
    - ["(?:1st|First)\\s+Ave", "East\\s+34th\\s+St"]
    - ["(?:1st|First)\\s+Ave", "East\\s+42nd\\s+St"]
  corner_buffer_m: 60
  clip_buffer_m: 25
  network_type: drive
  canyon_pattern:    "(?:Madison|Park|Lexington)\\s+Ave"
  secondary_pattern: "(?:3rd|Third|2nd|Second|1st|First)\\s+Ave"
  midblock_pattern:  "East\\s+(?:3[4-9]|4[0-2])(?:st|nd|rd|th)\\s+St"
  exclude_pattern:   "(?:Tunnel|Ramp|Viaduct|Bridge|Expressway|FDR|Pershing|Depew|Vanderbilt|Park Avenue South)"

sampling:
  grid_spacing_m: 20
  dedupe_radius_m: 10
  snap_tol_m: 2.0
  headings: [0, 90, 180, 270]
  fov: 90
  pitch: 0
  image_size: 640
  max_pano_offset_m: 15
  solid_angle_weighting: true

capture:
  target: "2026-04"

# Manhattan's grid is rotated ~29 deg east of true north (Commissioners'
# Plan 1811, set perpendicular to the Hudson shoreline). Pedestrian travel
# bearings follow the grid, not true north.
directional:
  grid_bearing: 29.0
  fov: 180.0            # forward field of view; people do not look behind
  n_bins: 360           # azimuthal profile resolution, degrees
  along_street_tol: 35

# Zones are gone, not disabled. The latitude cutoffs matched no published
# boundary, and a horizontal cut across a grid rotated ~29 deg ran diagonally
# through the street pattern -- every one of the 15 streets was split between
# two zones, East 38th St 43 nodes to 1. What the categories were encoding is
# a monotone north-south gradient in greenness (rho -0.49 node, -0.46 face),
# now carried continuously as `northing_m` along bearing 029 by gridaxis.py.
#
# If a neighbourhood claim is wanted later, it needs a real polygon (the LPC
# Murray Hill Historic District) or a land-use covariate from PLUTO -- an
# office-district-versus-residential hypothesis tested with latitude is
# testing it with a proxy.

segmentation:
  model: facebook/mask2former-swin-large-ade-semantic
  batch_size: auto
  vegetation_labels: [tree, grass, plant, flower, palm]
  sky_labels: [sky]
  building_labels: [building, house, skyscraper, hovel, tower]

open_vocabulary:
  enabled: true
  model: CIDAS/clipseg-rd64-refined
  threshold: 0.4
  # Sidewalk sheds are everywhere in Manhattan and ADE20K has no class for
  # them, so they are labelled building or road and vanish into the shares.
  # These prompts replaced an earlier set that could not tell the flagged
  # shed at n00417 (E 41st) from an ordinary Park Avenue frame: on the
  # positive it read 6.8% of pixels above threshold against 8.0% on the
  # negative. The set below reads 14.6% against 4.5% on the same pair.
  # Still indicative, not a measurement -- see min_scaffold_sep below.
  scaffold_prompts:
    - "a sidewalk shed, a temporary overhead walkway canopy on posts above the pavement"
    - "scaffolding pipes and planks covering a building facade"
    - "a construction hoarding fence of plywood along the sidewalk"
  # Scored contrastively: max(positive) - max(negative) per pixel, above
  # scaffold_contrast. A bare CLIPSeg probability answers "does this look
  # somewhat like scaffolding", which a distant glass facade does -- it put
  # 11.8% of an East 42nd frame above threshold on a building with no shed
  # on it, and 4.5% on Park Avenue. Subtracting what the same pixels score
  # for "a plain building facade" asks the better question: does this look
  # MORE like scaffolding than like the ordinary street it sits in. On the
  # same three frames that reads 6.1% on the true shed and 0.0% on both
  # false positives.
  scaffold_negative_prompts:
    - "a plain building facade"
    - "a glass office tower"
    - "an ordinary city street with no construction"
    - "a stone building wall"
  scaffold_contrast: 0.15

geometry:
  corridor_m: 35
  # How far each side of the probe reaches. 40 m caps a measurable street at
  # 80 m facade to facade, which no street in the study area exceeds -- the
  # readings above that were crossings measured diagonally, not sections.
  #
  # The cost is asymmetry: a node with facades at 10 m and 45 m totals 55 m,
  # well inside 80, but its 45 m side fails a 40 m reach and the node is lost
  # rather than clipped. At 90 m reach 627 nodes measured; at 40 m, 584.
  # Capping the TOTAL at 80 m instead would keep 569 and lose only genuinely
  # wide readings -- see hw_max_w_m below, which does that as well.
  facade_half_m: 40
  # The width probe is a CONE, not a line. A thin ray slides through gaps
  # between footprint polygons and past building edges: 12 per cent of
  # mid-block nodes failed that way. The error being tolerated is angular --
  # a mis-estimated street bearing displaces the ray in proportion to
  # distance -- so the tolerance is angular too: 1.2 m wide at 14 m, 7.9 m at
  # 90 m. Measured at +/-1, 2.5, 5 and 10 degrees; per-street median widths
  # are unchanged at 2.5 (East 41st 19.0 m, Park Avenue 43.6 m) while 37
  # more nodes resolve.
  #
  # Widened 2.5 -> 10 after finding 169 nodes where the probe found a facade
  # on one side only. Re-measuring the 502 nodes that already had a width:
  # median 30.4 -> 29.6 m, median shift -0.07 m, and 118 more nodes resolve.
  # 25 degrees was also tried and moves the median a further 2.3 m -- it
  # starts catching buildings down the block rather than across the street --
  # so 10 is the widest setting that leaves the existing measurements alone.
  facade_cone_deg: 10
  # Used only to decide WHY a side came back empty, never to measure a width.
  # A side with no footprint even in this much wider fan is genuinely open --
  # no wall there to find -- rather than one the probe aimed past.
  facade_open_test_deg: 25
  # ...and it reaches further than the measuring probe, deliberately. These are
  # two different questions and one distance cannot serve both: "how far to the
  # opposite wall" is capped at facade_half_m because nothing beyond that is a
  # street, but "is there NO wall at all" must look past that cap or a 50 m gap
  # gets certified as open sky. Sharing the 40 m reach put 17 nodes into
  # open_one_side that have a wall at 40-90 m -- eight consecutive Park Avenue
  # tunnel nodes among them -- each taking Omega = 1.0 on the strength of a
  # wall the probe was too short to see.
  facade_open_reach_m: 90
  # ...unless the empty bearing happens to point down a cross street, which
  # is also empty for 90 m and looks identical to open sky. A corner node
  # caught this way is the crossing case, not an open street, and belongs in
  # the segment-median fill.
  #
  # Measured against that street's fitted AXIS, not the bearing to its nearest
  # node. Small angle = looking along the corridor = a crossing; large angle =
  # looking across it, which can be genuinely open. The nearest-node version
  # demoted n00030, whose empty side is the East River: 18.4 deg to the
  # nearest tunnel-segment node but 84.8 deg to that road's axis.
  open_cross_angle_deg: 20
  open_cross_dist_m: 25
  # Which probe measures the width.
  #
  # `cone` is a wedge from the node that widens with distance, tolerating an
  # angular error in the fitted street bearing. `band` is a parallel-sided
  # corridor one node-spacing wide, sampled by hw_band_rays parallel rays; it
  # tiles the street so adjacent nodes never measure the same frontage twice,
  # and unlike the cone it does not widen at range, so it cannot punch through
  # a gap onto the next block.
  #
  # hw_band_stat picks how the rays are reduced. `min` takes the nearest wall
  # any ray found, which is the same question the cone asks. `median` takes the
  # typical wall distance across the corridor, a different quantity: on a
  # broken frontage the two disagree by a lot (n00527 gives 18.9 against 33.3)
  # because half the rays escape through a gap.
  #
  # WHY band+min AND NOT THE CONE. Pooled over all nodes the cone correlates
  # better with measured enclosure -- rho +0.543 against +0.482 vs VEI -- and
  # that comparison is a Simpson's paradox. Split by whether a node sits at a
  # crossing, band+min matches the imagery at least as well in every subgroup:
  #
  #                                band - cone      95% CI
  #   mid-block     vs VEI              +0.005   [-0.017, +0.030]
  #   mid-block     vs sky share        +0.004   [-0.022, +0.029]
  #   at a crossing vs VEI              +0.025   [-0.090, +0.154]
  #   at a crossing vs sky share        +0.004   [-0.100, +0.127]
  #   pooled        vs VEI              -0.064   [-0.103, -0.032]
  #
  # The cone's pooled lead comes from returning enormous widths at crossings
  # -- 110 m at n00377, on a street whose corner buildings stand 10 m away --
  # which splits the data into two clumps that happen to track crossing versus
  # mid-block. Crossings really are more open, so the cone is rewarded for
  # encoding crossing-ness rather than for measuring width. Every within-group
  # CI spans zero, so this does not make band+min better; it removes the
  # cone's apparent advantage and leaves the physical argument to decide.
  #
  # That argument: a pedestrian's enclosure responds to the nearest facade in
  # view, the band tiles the street so adjacent nodes never measure the same
  # frontage twice, and it does not report 110 m on a 20 m street.
  hw_probe: band            # cone | band
  hw_band_stat: min         # min | median
  hw_band_rays: 9
  # Total facade-to-facade width accepted. Anything wider is a crossing being
  # measured across its diagonal, not a street. Redundant with a 40 m reach
  # (2 x 40 = 80) but kept explicit so the reach can change without silently
  # changing what counts as a street.
  hw_min_w_m: 4
  hw_max_w_m: 80
  # A node inside a crossing has no facade on the perpendicular -- the ray
  # points down the cross street. 87 per cent of nodes within 15 m of a
  # crossing fail, against a flat 12 per cent everywhere else. H/W is not
  # mismeasured there, it is undefined: there is no street wall to measure.
  # Those nodes inherit the median of measured nodes on the same street
  # within this radius, because the canyon they sit in is the street's, and
  # HW_source records which nodes were filled rather than measured.
  # 20 * sqrt(2) = 28.28 m: the diagonal of one 20 m sampling cell, so a node
  # inherits only from its immediate neighbours. Nodes on a street are
  # collinear, so this reaches the node before and after at 20 m and stops
  # short of the next at 40 m -- a one-donor "median" is a copy of the
  # neighbour, not a smoothed estimate. Wider radii were measured: 60 m gives
  # 4 donors and rho +0.752 against VEI, 120 m gives 6 donors, spread 1.40 and
  # rho +0.708. All three are indistinguishable under a face-clustered
  # bootstrap, so this is chosen on the principle that a borrowed aspect ratio
  # should come from the adjacent street section, not from 120 m away.
  hw_fill_radius_m: 28.2842712474619
  # mean or median over the donors. At this radius the pool is one or two
  # nodes and the two agree to 0.000, so the choice is inert here; it matters
  # only at wide radii, where a donor pool can straddle a morphological break
  # (East 40th runs 0.87-7.89 within 120 m) and the mean lands in a gap no
  # node on the street occupies.
  hw_fill_stat: mean        # mean | median
  # Fill order, both operating on the street's own ordered series:
  #   1. mean of every measured node on the same street within the radius
  #   2. if none, walk the series outward and take the first measured node
  #      found either way, nearer side winning
  # Step 2 exists because a radius reaching one spacing cannot fill a RUN --
  # every node inside a run has an unmeasured neighbour by construction. Every
  # street here holds at least one measured node, so step 2 always resolves.
  height_min_m: 3
  height_max_m: 400
  footprint_datasets: [5zhs-2jue, qb5r-6dgf, nqwf-w8eh]

# tools/pedestrian.py and tools/face_samples.py. The pedestrian-realm
# classes, grouped by the role each plays for someone on foot rather than
# by ADE20K's own tree, and the colour each is drawn in. Matching is EXACT
# against ADE20K's comma-separated synonyms, never substring -- "tree" is
# inside "street lamp", "car" inside "placard", "sky" inside "skyscraper",
# and each of those would put a class in the wrong group invisibly. Every
# synonym therefore has to be listed in full.
#
# "pot" and "stool" are omitted deliberately: both are synonyms of ADE20K's
# "toilet" class, so including them pulls toilets into vegetation and
# seating. "flowerpot" is unique to the pot class.
#
# clipseg_prompts are what ADE20K cannot label. They are INDICATIVE only --
# the threshold under open_vocabulary is untuned against hand-labelled
# data, so they locate features rather than measure them.
pedestrian:
  ade_groups:
    sidewalk:
    - sidewalk
    - pavement
    - path
    road:
    - road
    - route
    vegetation:
    - tree
    - grass
    - plant
    - flora
    - plant life
    - flower
    - palm
    - palm tree
    - flowerpot
    seating:
    - bench
    - chair
    - seat
    - armchair
    barrier:
    - fence
    - fencing
    - railing
    - rail
    - bannister
    - banister
    - balustrade
    - balusters
    - handrail
    steps:
    - stairs
    - steps
    - stairway
    - staircase
    - step
    - stair
    furniture:
    - pole
    - streetlight
    - street lamp
    - ashcan
    - trash can
    - garbage can
    - wastebin
    - dustbin
    - sculpture
    - fountain
    - awning
    - sunshade
    - signboard
    - sign
    - traffic light
    - traffic signal
    - booth
    - kiosk
    - stall
    vehicle:
    - car
    - auto
    - automobile
    - motorcar
    - truck
    - motortruck
    - van
    - bus
    - autobus
    - coach
    - bicycle
    - bike
    - cycle
    - minibike
    - motorbike
    person:
    - person
    - individual
    - someone
    - somebody
    building:
    - building
    - edifice
    - house
    - skyscraper
    - hovel
    - hut
    - tower
    sky:
    - sky
  clipseg_prompts:
    bollard: a row of short metal bollards on the pavement
    planter: a raised planter box with shrubs on the street
    tree_pit: a tree pit with soil or plants around a street tree
    tactile: yellow tactile paving with raised bumps
    bike_rack: a bicycle rack or parked bicycles on the sidewalk
    play_equip: outdoor play equipment or a children's play structure
  # Hue families, so that a colour collision means the two things really
  # are related. Greens are vegetation, split by height; purples are
  # facade; tans and browns are the ground plane; greys are the
  # carriageway; orange is reserved for temporary structure, which is why
  # seating moved off it -- scaffolding and a bench were both orange and
  # unreadable side by side.
  palette:
    vegetation_eye: '#14682a'      # below camera height: shrubs, hedges, planters
    vegetation_canopy: '#86d18d'   # above it: tree crowns, balcony planting
    vegetation: '#4a9e4a'          # unsplit, for tools that do not have the horizon
    building: '#b57fd4'
    scaffolding: '#e6550d'
    sidewalk: '#d9c9a3'
    steps: '#a8763e'
    road: '#8a8a8a'
    vehicle: '#4d4d4d'
    barrier: '#b03a48'
    seating: '#00868b'
    furniture: '#d9b310'
    person: '#e8567c'
    sky: '#7fc4f0'
    other: '#3f3f3f'
    bollard: '#c0392b'
    planter: '#2e8b57'
    tree_pit: '#6b8e23'
    tactile: '#e0c200'
    bike_rack: '#1f77b4'
    play_equip: '#ff7f0e'

# The Street Interface Matrix of the morphology study, as pixel classes.
#   SIM = a*GVI_eye + b*EBC + c*TEF + d*SAI
# Each domain below is one term. Matching is EXACT against this
# checkpoint's labels, which are bare names -- facebook/mask2former-swin-
# large-ade-semantic returns "pot", not "pot, flowerpot". A label set that
# carries the full ADE20K synonym strings would make "pot" and "stool" hit
# the toilet class (65: "toilet, can, commode, crapper, pot, potty, stool,
# throne"), so those two stay dangerous on any other checkpoint.
#
# What ADE20K simply does not have, checked against the model: arcade,
# bollard, hedge, shrub, planter, pergola, porch, balcony, gate, grille.
# Four of the study's named features are in that list, so the terms they
# belong to are measured from a proxy or not at all -- see the notes.
sim:
  # Declared, not fitted. There is no measured dwell outcome in this study,
  # so nothing exists to fit these against -- calling them optimised would be
  # the one claim a reviewer could not let pass. They are stated priors, and
  # the index is only ever a weighted restatement of the pixel shares.
  weights:
    # relative, normalised by common.weights(); 1/1/1 is exact equal thirds
    dimension:     {green: 1, morphological: 1, permeability: 1}
    green:         {eye: 0.60, ground: 0.40}
    morphological: {articulation: 0.35, enclosure: 0.40, openness: 0.25}
    permeability:  {walkable: 0.50, affordance: 0.50}
  # Several terms are extremely sparse -- eye-level greenery has a median
  # share of 0.001 and the affordance classes are zero at a third of nodes.
  # A raw share would contribute nothing against building at 0.43, so the
  # sparse terms pass through 1 - exp(-x/s0) with s0 set to the term's own
  # quantile below. That is a diminishing-returns claim, not a rescaling
  # trick: one bench makes a spot dwellable, ten do not make it ten times
  # more so. It also means the index is relative to this study area.
  saturation_quantile: 0.75
  groups:
    # Omega_eye. Split at the horizon into below/above camera height at
    # draw time; only the below half is the study's eye-level term.
    eye_green: [tree, grass, plant, flower, palm]
    # Omega_hard. "walls" in the study means low garden walls; ADE20K's
    # wall class is the building face, so including it would swallow every
    # facade. Left out, which undercounts this term.
    hard_barrier: [fence, railing, bannister, balustrade, handrail, rail]
    # Omega_soft. Planters and low hedges are the study's examples and
    # neither exists in ADE20K. "pot" is the flowerpot class and is the
    # only available proxy, so this term is badly undercounted.
    soft_buffer: [pot]
    # Omega_shelter. Arcades and porticos are absent; awning and canopy
    # are the closest classes. Column is included as the portico/arcade
    # support, which is a judgement call and the one to revisit first.
    # In Manhattan this term is dominated by sidewalk sheds, which no
    # validated detector currently finds -- see tools/scaffold_eval.py.
    shelter: [awning, canopy, column]
    # Omega_rest. Stoops are stairs at the building line; ADE20K cannot
    # tell a stoop from any other step, so this term includes both.
    rest: [bench, chair, seat, armchair, stool, stairs, step, stairway,
           staircase, stair]
    # Place Identity's "signboard and architectural detail". ADE20K has no
    # architectural-detail class, so the facade openings stand in for it:
    # windows and doors are where articulation actually reads at eye level,
    # and they double as the ground-floor permeability proxy. Naming the
    # proxy here rather than in the paper keeps the substitution visible.
    articulation: [signboard, windowpane, door]
    # Denominators named in the SIM formula.
    building: [building, house, skyscraper, hovel, tower, wall]
    sky: [sky]
    sidewalk: [sidewalk, pavement]
    # Context. Not in any SIM term, drawn so that nothing large lands in
    # "other" without being visible.
    road: [road, route]
    vehicle: [car, truck, van, bus, bicycle, minibike, motorbike]
    person: [person]
  palette:
    eye_green: '#14682a'
    canopy_green: '#86d18d'
    hard_barrier: '#b03a48'
    soft_buffer: '#2e8b57'
    shelter: '#e6a02c'
    rest: '#00868b'
    articulation: '#e3c7f5'        # facade openings: a lighter tint of building
    building: '#b57fd4'
    sky: '#7fc4f0'
    sidewalk: '#d9c9a3'
    road: '#8a8a8a'
    vehicle: '#4d4d4d'
    person: '#e8567c'
    other: '#3f3f3f'

# tools/openvocab_eval.py. Per-class validation of open-vocabulary
# grounding, against city registers rather than against opinion. The
# morphology study argues a VLM should replace closed-set segmentation
# because ADE20K cannot see arcades, planters or bollards. That may well be
# right, but the one class already tested -- scaffolding, against DOB
# permits -- came back at AUC 0.51. So each class is tested separately, and
# street_tree is in the list as a positive control: ADE20K definitely has a
# tree class, so a harness that cannot score that one is broken.
#
# Every truth source is a geocoded city register with a point per object.
# Their errors (address points, stale rows, objects behind the camera) are
# unrelated to what a prompt thinks the object looks like, which is what
# makes them usable as labels.
openvocab_eval:
  radius_m: 25
  n_nodes: 30              # balanced, half with the object in view
  classes:
    street_tree:
      truth: {dataset: uvpi-gqnh, where: "status = 'Alive'"}
      ade: [tree, palm]
      prompts:
        - "a street tree growing from the sidewalk"
        - "the trunk and canopy of a tree beside the road"
      negatives:
        - "a plain building facade"
        - "an empty paved street with no planting"
    bench:
      truth: {dataset: kuxa-tauh}
      ade: [bench, chair, seat, armchair, stool]
      prompts:
        - "a public bench for sitting on the sidewalk"
        - "a seat or seating ledge at the edge of the pavement"
      negatives:
        - "a plain building facade"
        - "an empty pavement with nothing on it"
    bus_shelter:
      truth: {dataset: t4f2-8md7}
      ade: [awning, canopy, booth]
      prompts:
        - "a bus shelter with a roof and glass side panels"
        - "a covered waiting structure on the pavement"
      negatives:
        - "a plain building facade"
        - "an empty pavement with nothing on it"

# tools/dob_sheds.py. Ground truth for scaffolding, from the permits that
# put it there. NYC requires a permit for every sidewalk shed, supported or
# suspended scaffold and construction fence, and DOB NOW records each with
# an address, a lat/lon, an issue date and an expiry date. That last pair is
# what makes it usable here: a shed is only ground truth for an image if it
# was standing on the day the image was taken, and the capture window is a
# single month. Inside the study bbox, 985 permits were live in 2026-04.
#
# It is not perfect ground truth. A permit is filed against a building, not
# a sidewalk segment, so the lat/lon is the address point rather than the
# structure; permits are sometimes signed off late, leaving a record live
# after the shed came down; and a shed on the far side of a wide avenue is
# in the permit set but may be invisible from the node. Those are stated
# rather than corrected -- the point is a defensible label to tune the
# open-vocabulary detector against, not a second measurement.
dob:
  dataset: rbx6-tga4          # DOB NOW: Build - Approved Permits
  work_types:
    - "Sidewalk Shed"
    - "Supported Scaffold"
    - "Suspended Scaffold"
    - "Construction Fence"
  match_radius_m: 30          # a node this close to the address point sees it
  page_size: 50000

# tools/eyelevel.py. Framework parameter 1: eye-level foliage (0.5-2.5 m)
# is claimed to drive GVI more than canopy above 4 m. At pitch 0 the horizon
# row of a gnomonic image is the camera-height plane, so anything appearing
# BELOW it stands below the camera -- about 2.5 m on a Street View car --
# at any distance. That gives the eye-level band with no depth estimate,
# which is why the split is stated in degrees of elevation and the ceiling
# is stated as camera height rather than as a height in metres.
eyelevel:
  camera_height_m: 2.5      # nominal Street View mast; the band ceiling
  bands_deg: [-45, 0, 15, 45]
  band_labels:
    - "below camera height"
    - "0-15 deg above"
    - "15-45 deg above"
  n_nodes: 12               # subset size; run the full frame only after this
  out_name: eyelevel_by_node.csv

# tools/cubemap_check.py. The only thing in the repo that spends money:
# 6 fresh Street View requests per sampled node. Stratified by GVI quartile
# so the subsample spans the range rather than the pretty end.
cubemap:
  n_subsample: 100
  cost_per_request: 0.007   # list price, for the cost estimate only

# tools/s03_subset.py. Stage 3 is hours of segmentation over 579 nodes and
# writes to azimuth_profiles.npz as it goes, so it is the wrong loop to
# iterate a code change in. The subset runner re-profiles a stratified
# handful of nodes from the JPEGs already on disk -- no network, no Street
# View requests -- into a separate file, and diffs the result against the
# saved profiles in GVI/VEI terms.
s03_subset:
  n_nodes: 12
  out_name: azimuth_profiles_subset.npz
  report_tol: 0.01        # GVI points / VEI units; below this is float noise

# Stage 7. Band edges come from section 4 of the framework document
# ("The related parameters pertinent to the green view index"), fixed
# before any GVI was inspected. That prior specification is what makes the
# inverted-U testable; see src/s07_enclosure.py for why a failed linear
# fit would not have been a reason to try one.
enclosure:
  bands: [0.0, 0.3, 0.8, 1.5, 3.0, .inf]
  band_labels:
    - "<0.3 under-enclosed"
    - "0.3-0.8 transitional"
    - "0.8-1.5 human scale"
    - "1.5-3.0 enclosed"
    - ">3.0 deep canyon"
  min_band_n: 30          # below this a band is out of scope, not a null
  # The envelope diagram: equal-count H/W bins, median GVI in each, with a
  # confidence interval bootstrapped over block faces rather than nodes.
  # It is the descriptive counterpart to the Lind-Mehlum test -- the shape
  # shown as the data draw it, with no functional form imposed.
  envelope_bins: 8

spatial:
  moran_radius_m: 60
  moran_permutations: 199
  face_gap_m: 40
  face_max_run_m: 90
  bootstrap_n: 2000

# Street Interface Matrix as formulated in the 2026-08-24 manuscript, built
# from VLM-extracted terms rather than pixel shares. Distinct from `sim:`
# above, which stays on ADE20K pixel counts -- the two are reported side by
# side, and neither is the other's replacement.
#
# Declared, not fitted, for the same reason `sim:` is: there is no measured
# dwell outcome to fit against. Equal thirds unless a reason exists to differ.
sim_vlm:
  weights:
    # relative, normalised by common.weights(); 1/1/1 is exact equal thirds
    dimension:    {imageability: 1, identity: 1, dependence: 1}
    imageability: {nat_built: 1, gvi_eye: 1, gmi: 1}
    identity:     {signboard: 1, enclosure: 1, sfv: 1}
    # Section 2.7: D_raw = g1*V_pave + g2*IAS + g3*GFAPI. `ias` was `sfv`
    # until the resting_affordance field existed -- which put facade
    # variation in both Y and D and left Dependence with no affordance term,
    # so the dimension measured walkable ground, an Identity trait, and
    # ground-floor glazing rather than physical utility.
    dependence:   {sidewalk_paver: 1, ias: 1, gfapi: 1}
  # P_natural_above / P_built_above is a ratio of two free quantities and is
  # unbounded, while every other term is a share in [0,1]. Summing them under
  # weights that total 1 would let the ratio decide the answer on its own --
  # the same trap sim_dwell.py documents for H/W against SVF. Mapped through
  # r/(1+r), which is monotone, fixes 1.0 at 0.5, and is bounded.
  nat_built_transform: ratio_over_one_plus_ratio
  # ---- manuscript section 2.7, Cobb-Douglas coupling -------------------
  # M_i = I^a * Y^b * D^c * Omega_i.  The exponents are elasticities and must
  # sum to 1; they are NOT mixing weights and the composition is NOT a sum.
  # Only Imageability and Dependence are sigmoidal -- Identity is linear,
  # because greenery and walkability have activation thresholds and
  # legibility does not.
  cobb_douglas:
    exponents:            {imageability: 0.40, identity: 0.20, dependence: 0.40}
    # The GLOBAL calibration -- the thresholds the manuscript states, fixed
    # across cities so two study areas sit on one scale. Nature.8.31 para 129
    # defends tau_I = 0.20 as "the minimum eye-level vegetation exposure
    # required to trigger cognitive restoration", separating avenue canyons at
    # GVI_eye <= 0.06 from covenant mid-blocks at 0.22 -- an external anchor a
    # median does not have.
    #
    # tau_D was 0.15 and is now 0.50. Para 50 names the old value as the
    # "legacy threshold ... against a median D_raw of 0.50 (forcing 96% of rows
    # to sit on the saturated upper rail)" and states the City-Wide Median
    # Calibration protocol as the fix. Our own median D_raw is 0.500, matching
    # the paper's figure exactly.
    #
    # sim_compute.py ALSO emits a local calibration alongside this one, with
    # tau set to this frame's own medians per the CWMC rule. Local gives
    # within-city relativity; global allows comparison between cities. For
    # Murray Hill they agree on D and differ on I (0.389 against 0.20), and
    # the two rankings correlate rho +0.930.
    imageability_sigmoid: {kappa: 12.0, tau: 0.20}
    dependence_sigmoid:   {kappa: 15.0, tau: 0.50}
    omega:                {psi: 0.15, hw_threshold: 2.0}
    # section 2.8 regimes, classified on H/W
    canyon_hw: 3.0
    midblock_hw: [0.8, 1.2]
    elasticity_by_regime:
      # canyon: c -> 0.60, b -> 0.10 are stated; a is the remainder
      avenue_canyon:     {imageability: 0.30, identity: 0.10, dependence: 0.60}
      # mid-block: only a -> 0.50 is stated. b holds at its global 0.20 and c
      # takes the remainder. That inference lives here, not in the code.
      covenant_midblock: {imageability: 0.50, identity: 0.20, dependence: 0.30}
      # POPS: all three stated
      pops_setback:      {imageability: 0.45, identity: 0.15, dependence: 0.40}
  # t_effective = t_base * (1 + lambda * M_i). The manuscript gives no value
  # for lambda, so this is a placeholder and must not be reported as fitted.
  dwell_lambda: 1.0

  # Bands for the H/W estimate. The VLM returns a NUMBER and the band is
  # derived here, so the prompt cannot anchor the model to one category --
  # which is exactly what happened when the categories were asked for
  # directly and 1252 of 1252 panoramas came back "human_scale".
  hw_bands: {under_enclosed: 0.8, deep_canyon: 1.5}
